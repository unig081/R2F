root: ${R2F_ROOT:.}
seed: 42
model_family: ${R2F_MODEL_FAMILY:llama}  # llama -> Llama 3.2; phi -> Phi-4; qwen -> Qwen3

paths:
  source_model: ${R2F_SOURCE_MODEL:}
  forget_file: ${R2F_FORGET_FILE:dataset/TOFU/forget05.json}
  retain_file: ${R2F_RETAIN_FILE:dataset/TOFU/retain95.json}

model:
  dtype: bfloat16
  device_map: auto
  attn_implementation: null
  trust_remote_code: true
  max_length: 1024

unlearning:
  gamma: 1.0
  alpha: 1.0
  batch_size: 1
  grad_accum_steps: 8
  lora_learning_rate: 1.0e-4
  max_steps: 512
  target_modules: null
  train_layers: null
  train_modules: null

lora:
  r: 32
  alpha: 64
  dropout: 0.05

decoder_samples:
  max_forget_samples: 512
  coords_per_module: 8192
  flush_every_steps: 8
  deterministic_capture: true
  output_path: ${R2F_OUTPUT_DIR:results}/gradients/llama1b_decoder_samples.pt
  stats_path: ${R2F_OUTPUT_DIR:results}/gradients/llama1b_grad_stats.json

decoder:
  projection_ridge: 1.0e-4

smoke:
  max_length: 256
  max_forget_samples: 2
  max_retain_samples: 2
  train_layers:
    - 0
  coords_per_module: 256
