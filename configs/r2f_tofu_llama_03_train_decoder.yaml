root: ${R2F_ROOT:/mnt/data1/zxc/R2F}
seed: 42

paths:
  source_model: ${R2F_SOURCE_MODEL:/mnt/data1/zxc/models/llama_3_2_1B_instruct_tofu}
  target_model: ${R2F_TARGET_MODEL:/mnt/data1/zxc/models/llama_3_2_3B_instruct_tofu}
  forget_file: ${R2F_FORGET_FILE:/mnt/data1/zxc/datasets/tofu/forget05.json}
  retain_file: ${R2F_RETAIN_FILE:/mnt/data1/zxc/datasets/tofu/retain95.json}
  output_dir: ${R2F_OUTPUT_DIR:/mnt/data1/zxc/R2F/results}

model:
  dtype: bfloat16
  device_map: auto
  attn_implementation: null
  trust_remote_code: true
  max_length: 1024

decoder_samples:
  max_forget_samples: 512
  coords_per_module: 8192
  flush_every_steps: 8
  deterministic_capture: true
  output_path: ${R2F_OUTPUT_DIR:/mnt/data1/zxc/R2F/results}/gradients/llama1b_decoder_samples.pt
  stats_path: ${R2F_OUTPUT_DIR:/mnt/data1/zxc/R2F/results}/gradients/llama1b_grad_stats.json

decoder:
  checkpoint_path: ${R2F_OUTPUT_DIR:/mnt/data1/zxc/R2F/results}/decoder/checkpoint.pt
  stats_path: ${R2F_OUTPUT_DIR:/mnt/data1/zxc/R2F/results}/decoder/stats.json
  curve_path: ${R2F_ROOT:/mnt/data1/zxc/R2F}/reports/decoder_training_curve.json
  batch_size: 8192
  epochs: 1
  lr: 3.0e-4
  weight_decay: 1.0e-4
  hidden_dim: 512
  module_embedding_dim: 16
  dropout: 0.05
  projection_ridge: 1.0e-4
  target_clip: 8.0
  sign_threshold: 0.05
  sign_loss_weight: 0.01
  checkpoint_every_steps: 250
  fail_fast_on_weak_baseline: true
  baseline_min_abs_corr: 0.02
  baseline_min_sign_acc: 0.51

smoke:
  max_length: 256
  max_forget_samples: 2
  coords_per_module: 256
  decoder_steps: 20

