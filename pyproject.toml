[project]
name = "r2f-tofu"
version = "0.1.0"
description = "TOFU/LLaMA R2F coordinate-wise gradient decoder experiments"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
